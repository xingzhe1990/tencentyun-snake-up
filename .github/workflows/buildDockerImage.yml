name: Build and Push to Huawei SWR

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 镜像仓库区域：cn-north-4 = 北京四
  REGISTRY: swr.cn-north-4.myhuaweicloud.com
  # 格式：<SWR 组织名>/<镜像仓库名>，按需改
  IMAGE_NAME: moutai-wine/tencentyun-snake-up

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 先做一次廉价的自检，避免语法错误等到镜像构建到一半才暴露
      - name: Python 语法检查
        run: |
          python3 -m py_compile get_cookies.py snap_up_server.py
          echo "语法检查通过"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      # PR 只构建不推送（fork 的 PR 拿不到 secret，也避免污染仓库）
      - name: 登录华为云 SWR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HUAWEI_USERNAME }}
          password: ${{ secrets.HUAWEI_PASSWORD }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # CI 在海外机房，用官方 PyPI 比清华源快
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          # GitHub Actions 缓存，chromium 那 153MB 只下载一次
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SWR 不认识 OCI attestation manifest，必须关掉，否则推送报错或拉取异常
          provenance: false

# ---------------------------------------------------------------------------
# 附：如果哪天想同时/改为推 GitHub Packages（GHCR，无需额外 secret），
# 把 env 换成下面两行，并恢复 permissions.packages: write：
#
#   REGISTRY: ghcr.io
#   IMAGE_NAME: ${{ github.repository }}
#
# 且登录步骤改为 username: ${{ github.actor }} / password: ${{ secrets.GITHUB_TOKEN }}
# ---------------------------------------------------------------------------
