name: Publish to Huawei ACR

on:
  push:
    branches: [dev-database]

jobs:
  push_to_acr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v3
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Copy JAR to docker directory
        run: cp target/*.jar docker/

      - name: Log in to Huawei ACR
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          registry: swr.cn-north-4.myhuaweicloud.com  # 改为你的区域
          username: ${{ secrets.HUAWEI_USERNAME }}
          password: ${{ secrets.HUAWEI_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: docker
          dockerfile: ./Dockerfile
          push: true
          tags: |
            swr.cn-north-4.myhuaweicloud.com/moutai-wine/tencentyun:202611190900